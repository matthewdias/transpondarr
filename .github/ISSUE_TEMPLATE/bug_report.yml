name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please do **not** include API keys, passwords, or
        other secrets in logs you paste. For security vulnerabilities, use
        **Security → Report a vulnerability** instead of a public issue.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
      placeholder: Steps to reproduce, expected vs actual behaviour.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Transpondarr version or image tag (see the startup log / footer).
      placeholder: v0.1.0
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How are you running it?
      options:
        - Docker (compose)
        - Docker (plain)
        - Binary
        - Built from source
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, qBittorrent version, indexer (Prowlarr/Jackett), reverse proxy — as relevant.
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact secrets first. This is automatically formatted as code.
      render: shell
