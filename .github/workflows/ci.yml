name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Reused as the release gate (release.yml), so a tag must pass the exact same
  # bar as a PR — including the generated-output drift checks and govulncheck.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs the exact toolchain pinned in mise.toml (Go, Node, sqlc,
      # golangci-lint, goreleaser, …) so CI matches local development.
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3

      - name: Build (frontend + backend)
        run: make build

      # Catch build steps that clobber committed files (e.g. web/dist/.gitkeep).
      - name: Build leaves tree clean
        run: git diff --exit-code

      - name: Vet
        run: go vet ./...

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      # THIRD-PARTY-NOTICES.md is committed generated output; fail if it has
      # drifted from what the current dependency set would produce.
      - name: Notices up to date
        run: |
          make notices
          git diff --exit-code THIRD-PARTY-NOTICES.md

      # api-types.ts is committed generated output; fail if it has drifted
      # from what the current OpenAPI spec would produce.
      - name: API types up to date
        run: |
          make gen-api
          git diff --exit-code frontend/src/lib/api-types.ts

      # internal/store/db is committed sqlc output; fail if it has drifted from
      # what the current queries and migrations would produce.
      - name: Query layer up to date
        run: |
          make gen
          git diff --exit-code internal/store/db

      - name: Vulnerability scan
        run: govulncheck ./... # version pinned in mise.toml
