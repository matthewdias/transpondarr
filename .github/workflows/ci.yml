name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Reused as the release gate (release.yml), so a tag must pass the exact same
  # bar as a PR — including the generated-output drift checks and govulncheck.
  # `needs` on a called workflow waits for every job in it, so the split below
  # keeps that guarantee without release.yml naming the jobs.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Three independent jobs rather than one serial one: nothing here depends on
# anything else here, and `make notices` (six cross-compiles) used to sit behind
# the full test suite for no reason.
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          go-cache: gobuild-go

      # web/dist/.gitkeep is committed, so go:embed resolves without a frontend
      # build — building the real assets belongs to the web job.
      - name: Build
        run: make server

      - name: Vet
        run: go vet ./...

      - name: Lint
        run: make go-lint

      - name: Test
        run: make go-test

      - name: Vulnerability scan
        run: govulncheck ./... # version pinned in mise.toml

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          node: "true"

      # `npm run build` is `tsc -b && vite build`, so this is also the typecheck.
      - name: Build
        run: make web

      # Catch build steps that clobber committed files (e.g. web/dist/.gitkeep).
      - name: Build leaves tree clean
        run: git diff --exit-code

      - name: Lint
        run: make web-lint

      - name: Test
        run: make web-test

  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          go-cache: gobuild-generated
          node: "true"

      # Ordered cheapest first, so a stale commit fails in seconds instead of
      # behind the cross-compiles `make notices` needs.

      # internal/store/db is committed sqlc output; fail if it has drifted from
      # what the current queries and migrations would produce.
      - name: Query layer up to date
        run: |
          make gen
          git diff --exit-code internal/store/db

      # api-types.ts is committed generated output; fail if it has drifted
      # from what the current OpenAPI spec would produce.
      - name: API types up to date
        run: |
          make gen-api
          git diff --exit-code frontend/src/lib/api-types.ts

      # THIRD-PARTY-NOTICES.md is committed generated output; fail if it has
      # drifted from what the current dependency set would produce.
      - name: Notices up to date
        run: |
          make notices
          git diff --exit-code THIRD-PARTY-NOTICES.md
